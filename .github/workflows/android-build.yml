name: Build Fairwas Android

on:
  push:
    branches: [android]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fairwas-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout android branch
        uses: actions/checkout@v4
        with:
          ref: android
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: android

      - name: Copy APK into repository app folder
        run: |
          mkdir -p app
          cp android/app/build/outputs/apk/debug/app-debug.apk app/fairwas-android-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fairwas-android-debug
          path: app/fairwas-android-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit APK to android branch
        run: |
          if git diff --quiet -- app/fairwas-android-debug.apk; then
            echo "APK unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/fairwas-android-debug.apk
          git commit -m "Build Android debug APK"
          git push origin HEAD:android
